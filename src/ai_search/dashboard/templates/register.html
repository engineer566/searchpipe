<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>注册 · SearchPipe</title>
<script>
(function(){try{var t=localStorage.getItem('searchpipe-theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="logo">🔍 SearchPipe</div>
      <p>注册即送内测免费额度</p>
    </div>

    <div class="card">
      {% if error %}
      <div class="form-error">{{ error }}</div>
      {% endif %}

      <form action="/dashboard/register" method="post">
        <div class="mb"><label>邮箱</label>
          <input type="email" name="email" placeholder="you@example.com" value="{{ email or '' }}" required>
        </div>
        <div class="mb"><label>密码</label>
          <input type="password" name="password" placeholder="至少 8 位" minlength="8" required>
        </div>
        <div class="mb"><label>确认密码</label>
          <input type="password" name="password_confirm" placeholder="再输入一次密码" minlength="8" required>
        </div>
        <button type="submit" class="btn btn-block">注册</button>
      </form>

      <div class="auth-links">
        <a href="/dashboard/login">已有账号？去登录</a>
      </div>
    </div>

    <div class="auth-foot">
      注册即代表同意服务条款 · <a href="/">返回首页</a>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
