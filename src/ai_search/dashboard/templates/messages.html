{% extends "base.html" %}
{% block title %}站内信 · SearchPipe{% endblock %}
{% block content %}
<div class="page-head">
  <h1>站内信</h1>
  <p>管理员发送的通知与工单回复会出现在这里。</p>
</div>

<div class="card">
  <h2>我的消息 <span id="msg-unread" class="tag tag-warn" style="display:none"></span></h2>
  <div id="message-list"><div class="empty">加载中…</div></div>
</div>
{% endblock %}
{% block script %}
<script>
async function loadMessages(){
  const el=document.getElementById('message-list');
  try{
    const d=await AIS.api('/messages?size=100');
    const badge=document.getElementById('msg-unread');
    if(d.unread_count>0){ badge.style.display=''; badge.textContent=d.unread_count+' 条未读'; }
    else{ badge.style.display='none'; }
    if(!d.items.length){ el.innerHTML='<div class="empty">暂无消息。</div>'; return; }
    el.innerHTML=d.items.map(m=>`
      <div class="card mb" id="msg-${m.id}" style="border-left:3px solid ${m.read?'var(--border)':'var(--accent)'};cursor:pointer" onclick="openMessage('${m.id}',${m.read})">
        <div class="row" style="align-items:center;gap:8px">
          ${m.read?'':'<span class="tag tag-warn">未读</span>'}
          ${m.kind==='broadcast'?'<span class="tag tag-neutral">广播</span>':''}
          <strong class="grow">${AIS.esc(m.title)}</strong>
          <span class="muted" style="font-size:12px;white-space:nowrap">${m.created_at.slice(0,16).replace('T',' ')}</span>
        </div>
        <div class="msg-body" style="display:none;margin-top:10px;white-space:pre-wrap">${AIS.esc(m.content)}</div>
      </div>`).join('');
  }catch(e){ el.innerHTML='<div class="empty">加载失败：'+AIS.esc(e.message)+'</div>'; }
}

async function openMessage(id, read){
  const card=document.getElementById('msg-'+id);
  const body=card.querySelector('.msg-body');
  body.style.display=body.style.display==='none'?'':'none';
  if(!read){
    try{
      await AIS.api('/messages/'+id+'/read',{method:'POST'});
      loadMessages(); // 刷新未读状态与角标
      if(window.AISRefreshUnreadBadge) AISRefreshUnreadBadge();
    }catch(e){ /* 标记失败不阻断阅读 */ }
  }
}
loadMessages();
</script>
{% endblock %}
