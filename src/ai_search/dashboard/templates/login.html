<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · SearchPipe</title>
<script>
(function(){try{var t=localStorage.getItem('searchpipe-theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="logo">🔍 SearchPipe</div>
      <p>为 AI 而生的搜索 API · 内测免费额度</p>
    </div>

    <div class="card">
      <!-- 邮箱密码登录 -->
      <div id="tab-email">
        <form action="/dashboard/login" method="post">
          <div class="mb"><label>邮箱</label>
            <input type="email" name="email" placeholder="you@example.com" required>
          </div>
          <div class="mb"><label>密码</label>
            <input type="password" name="password" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-block">登录</button>
        </form>
      </div>

      <div class="divider">或使用第三方账号</div>

      {% if github_oauth_enabled %}
      <a href="/auth/oauth/github" class="oauth-btn">
        <svg width="17" height="17" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        使用 GitHub 登录
      </a>
      {% else %}
      <p class="muted" style="text-align:center;font-size:13px;margin:0">GitHub OAuth 未配置 · 微信登录即将上线</p>
      {% endif %}
    </div>

    <div class="auth-foot">
      登录即代表同意服务条款 · <a href="/">返回首页</a>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
