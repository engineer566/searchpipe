<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · SearchPipe</title>
<script>
(function(){try{var t=localStorage.getItem('searchpipe-theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="logo">🔍 SearchPipe</div>
      <p>为 AI 而生的搜索 API · 内测免费额度</p>
    </div>

    <div class="card">
      <div class="tabs mb">
        <button type="button" class="tab-btn active" data-tab="sms">手机验证码</button>
        <button type="button" class="tab-btn" data-tab="email">邮箱密码</button>
      </div>

      <!-- 手机验证码登录 -->
      <div id="tab-sms">
        <form id="sms-form">
          <div class="mb"><label>手机号</label>
            <input type="tel" name="phone" placeholder="11 位手机号" pattern="\d{11}" required>
          </div>
          <div class="mb"><label>验证码</label>
            <div class="row">
              <input type="text" name="code" class="grow" placeholder="6 位验证码" pattern="\d{6}" required>
              <button type="button" id="send-code-btn" class="btn btn-ghost" style="flex-shrink:0">获取验证码</button>
            </div>
          </div>
          <button type="submit" class="btn btn-block">登录 / 注册</button>
        </form>
        <div id="sms-msg"></div>
      </div>

      <!-- 邮箱密码登录 -->
      <div id="tab-email" style="display:none">
        <form action="/dashboard/login" method="post">
          <div class="mb"><label>邮箱</label>
            <input type="email" name="email" placeholder="you@example.com" required>
          </div>
          <div class="mb"><label>密码</label>
            <input type="password" name="password" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-block">登录</button>
        </form>
      </div>

      <div class="divider">或使用第三方账号</div>

      {% if github_oauth_enabled %}
      <a href="/auth/oauth/github" class="oauth-btn">
        <svg width="17" height="17" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        使用 GitHub 登录
      </a>
      {% else %}
      <p class="muted" style="text-align:center;font-size:13px;margin:0">GitHub OAuth 未配置 · 微信登录即将上线</p>
      {% endif %}
    </div>

    <div class="auth-foot">
      登录即代表同意服务条款 · <a href="/">返回首页</a>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
<script>
// Tab 切换
const btns=document.querySelectorAll('.tab-btn');
btns.forEach(b=>b.onclick=()=>{
  btns.forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  document.getElementById('tab-sms').style.display=b.dataset.tab==='sms'?'block':'none';
  document.getElementById('tab-email').style.display=b.dataset.tab==='email'?'block':'none';
});
// 发送验证码
const sendBtn=document.getElementById('send-code-btn');
sendBtn.onclick=async()=>{
  const phone=document.querySelector('#sms-form input[name=phone]').value.trim();
  if(!/^\d{11}$/.test(phone)){alert('请输入 11 位手机号');return;}
  sendBtn.disabled=true;
  try{
    await AIS.api('/dashboard/sms/send',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'phone='+encodeURIComponent(phone)});
    let cd=60;
    const t=setInterval(()=>{ if(cd<=0){clearInterval(t);sendBtn.textContent='获取验证码';sendBtn.disabled=false;return;} sendBtn.textContent=cd+'s 后重发'; cd--; },1000);
  }catch(e){ sendBtn.disabled=false; alert(e.message); }
};
// 提交短信登录
document.getElementById('sms-form').onsubmit=async e=>{
  e.preventDefault();
  const f=new FormData(e.target);
  const r=await fetch('/dashboard/login/sms',{method:'POST',body:f,redirect:'manual'});
  if(r.status===303||r.status===0){ window.location.href='/dashboard'; }
  else { const d=await r.json().catch(()=>({})); alert(d.detail||'登录失败'); }
};
</script>
</body>
</html>
