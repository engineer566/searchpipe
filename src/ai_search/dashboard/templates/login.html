<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · SearchPipe</title>
<script>
(function(){try{var t=localStorage.getItem('searchpipe-theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="logo">🔍 SearchPipe</div>
      <p>为 AI Agent 而生的联网搜索 · 内测免费额度</p>
    </div>

    <div class="card">
      {% if info %}
      <div class="form-ok">{{ info }}</div>
      {% endif %}
      {% if error %}
      <div class="form-error">{{ error }}</div>
      {% endif %}

      <form action="/dashboard/login" method="post">
        <input type="hidden" name="next" value="{{ next or '' }}">
        <div class="mb"><label>邮箱</label>
          <input type="email" name="email" placeholder="you@example.com" value="{{ email or '' }}" required>
        </div>
        <div class="mb"><label>密码</label>
          <input type="password" name="password" placeholder="••••••••" required>
        </div>
        <div class="mb" style="display:flex;align-items:center;gap:8px;font-size:13px">
          <input type="checkbox" name="agree_terms" id="agree_terms" required style="width:auto;margin:0">
          <label for="agree_terms" style="margin:0;font-weight:normal;color:var(--muted)">我已阅读并同意<a href="/terms" target="_blank">《服务条款》</a></label>
        </div>
        <button type="submit" class="btn btn-block">登录</button>
      </form>

      <div class="auth-links">
        <a href="/dashboard/forgot-password">忘记密码？</a>
        <a href="/dashboard/register{% if next %}?next={{ next | urlencode }}{% endif %}">没有账号？立即注册</a>
      </div>
    </div>

    <div class="auth-foot">
      <a href="/">返回首页</a>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
