<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="{{ base_url }}{{ request.url.path }}">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png">
<meta name="theme-color" content="#4f46e5">
<title>重置密码 · SearchPipe</title>
<script>
(function(){try{var t=localStorage.getItem('searchpipe-theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="/static/app.css?v=20260914">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="logo"><svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M2.5 12h8.5" stroke-width="4.4"/><path d="M4.5 9.7v4.6M7.5 9.7v4.6" stroke-width="1.6"/><circle cx="15.8" cy="12" r="5.6"/></svg>SearchPipe</div>
      <p>设置新密码</p>
    </div>

    <div class="card">
      {% if invalid %}
      <div class="form-error">重置链接无效或已过期，请重新发起。</div>
      <div class="auth-links" style="justify-content:center">
        <a href="/dashboard/forgot-password">重新发起重置</a>
      </div>
      {% else %}
      {% if error %}
      <div class="form-error">{{ error }}</div>
      {% endif %}

      <form action="/dashboard/reset-password" method="post">
        <input type="hidden" name="token" value="{{ token }}">
        <div class="mb"><label>新密码</label>
          <input type="password" name="password" placeholder="至少 8 位" minlength="8" required>
        </div>
        <div class="mb"><label>确认新密码</label>
          <input type="password" name="password_confirm" placeholder="再输入一次新密码" minlength="8" required>
        </div>
        <button type="submit" class="btn btn-block">重置密码</button>
      </form>
      {% endif %}
    </div>

    <div class="auth-foot">
      <a href="/dashboard/login">返回登录</a> · <a href="/">返回首页</a>
    </div>
  </div>
</div>

<script src="/static/app.js?v=20260913"></script>
</body>
</html>
